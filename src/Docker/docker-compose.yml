services:
  web-api:
    image: ${DOCKER_REGISTRY-}webapi
    container_name: ${COMPOSE_PROJECT_NAME}-web-api
    build:
      context: ../..
      dockerfile: src/microservices/Web.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - postgres
    ports:
      - "${WEB_API_PORT}:8080"

  dataprocessor-api:
    image: ${DOCKER_REGISTRY-}dataprocessorapi
    container_name: ${COMPOSE_PROJECT_NAME}-dataprocessor-api
    build:
      context: ../..
      dockerfile: src/microservices/DataProcessor.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - postgres
    ports:
      - "${DATAPROCESSOR_API_PORT}:8080"   

  postgres:
    image: ankane/pgvector:latest
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    environment:
      POSTGRES_DB: clean-architecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME}-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    container_name: ${COMPOSE_PROJECT_NAME}-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.2
    container_name: ${COMPOSE_PROJECT_NAME}-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT}:5601"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  seq:
    image: datalust/seq:2024.3
    container_name: ${COMPOSE_PROJECT_NAME}-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq-data:/data


volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data

  elasticsearch-data:
    name: ${COMPOSE_PROJECT_NAME}-elasticsearch-data

  rabbitmq-data:
    name: ${COMPOSE_PROJECT_NAME}-rabbitmq-data

  seq-data:
    name: ${COMPOSE_PROJECT_NAME}-seq-data